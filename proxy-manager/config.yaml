---
name: Nginx Proxy Manager Experimental
version: "1.1"
slug: nginxproxymanagerexperimental
description: Phils Experimental NPM
url: https://github.com/tciprop/addon-nginx-proxy-manager
codenotary: codenotary@frenck.dev
webui: http://[HOST]:[PORT:81]
startup: services
init: false
arch:
  - aarch64
  - amd64
  - armv7
hassio_api: true
ports:
  80/tcp: 80
  81/tcp: 81
  443/tcp: 443
map:
  - addon_config:rw
backup_exclude:
  - "*/logs"
