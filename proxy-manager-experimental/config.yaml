---
name: UNOFFICIAL Nginx Proxy Manager
version: 0.0.13-logrotate
slug: proxy_manager_experimental
description: Modified Nginx Proxy Manager with logrotate fix
url: https://github.com/tciprop/addon-nginx-proxy-manager#logrotate_issue
webui: http://[HOST]:[PORT:81]
startup: services
init: false
arch:
  - aarch64
  - amd64
  - armv7
  - armhf
  - i386
hassio_api: true
ports:
  80/tcp: 80
  81/tcp: 81
  443/tcp: 443
map:
  - addon_config:rw
backup_exclude:
  - "/data/logs/*"
